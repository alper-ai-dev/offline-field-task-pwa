<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121316"><meta name="description" content="Offline-first field task PWA portfolio project"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Fieldly — Field Tasks</title></head><body><div class="app"><header><div><p class="eyebrow">FIELDLY / OPERATIONS</p><h1>Good morning,<br><span>let's move.</span></h1></div><button id="installBtn" class="install" hidden>Install</button></header><section class="status"><span id="netDot"></span><b id="netText">Online</b><small id="date"></small></section><section class="progress"><div class="ring" id="ring"><div><b id="doneCount">0</b><small>DONE</small></div></div><div><p>TODAY'S PROGRESS</p><h2 id="progressText">Ready to start</h2><small id="taskSummary">0 tasks planned</small></div></section><nav class="filters"><button class="active" data-filter="all">All</button><button data-filter="open">Open</button><button data-filter="high">Priority</button><button data-filter="done">Done</button></nav><main id="taskList"></main><button class="fab" id="addBtn" aria-label="Add task">+</button><section class="sheet" id="sheet" aria-hidden="true"><div class="backdrop" id="backdrop"></div><form class="panel" id="taskForm"><div class="handle"></div><div class="sheethead"><div><small>NEW FIELD TASK</small><h2>Plan the next move.</h2></div><button type="button" id="closeBtn">×</button></div><label>Task title<input id="title" required maxlength="70" placeholder="Inspect north entrance"></label><label>Location<input id="location" maxlength="60" placeholder="Site A · Zone 04"></label><div class="row"><label>Priority<select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label><label>Time<input id="time" type="time"></label></div><button class="save" type="submit">Add to today <span>→</span></button></form></section><div id="toast"></div></div><script src="app.js"></script></body></html>
